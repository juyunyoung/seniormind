# XcodeGen 설정. Mac에서: brew install xcodegen && cd "$HOME/seniormind/app/ios" && xcodegen generate
name: MemoryCapsule
options:
  bundleIdPrefix: com.daljoalab
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ko
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # 팀 ID·권한 파일·서버 주소는 Config/Local.xcconfig에서 지정(저장소에 올리지 않음)
    DEVELOPMENT_TEAM: $(MC_DEVELOPMENT_TEAM)
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "130.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
targets:
  MemoryCapsule:
    type: application
    platform: iOS
    sources:
      - path: MemoryCapsule
        excludes:
          - "Entitlements/**"
    dependencies:
      - package: WebRTC
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
    info:
      path: MemoryCapsule/Info.plist
      properties:
        CFBundleDisplayName: 기억의 캡슐
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 기억이와 목소리로 대화하려면 마이크가 필요해요.
        NSCameraUsageDescription: 보호자 등록 QR 코드를 읽으려면 카메라가 필요해요.
        NSAlarmKitUsageDescription: 약 드실 시간 같은 일정을 알람으로 알려 드려요.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: $(MC_BUNDLE_ID)
            # 팀 공통 QR·딥링크 스킴(백엔드 6.3, 팀 서버 qr_payload와 같음)
            CFBundleURLSchemes: [memorycapsule]
        MC_API_BASE_URL: $(MC_API_BASE_URL)
        MC_USE_MOCK: $(MC_USE_MOCK)
        MC_BACKEND: $(MC_BACKEND)
        MC_FIREBASE_PLIST: $(MC_FIREBASE_PLIST)
    settings:
      base:
        # 번들 ID는 Config의 MC_BACKEND로 정해진다(seniormind: com.daljoalab.seniormind, team: com.daljoalab.memorycapsule)
        PRODUCT_BUNDLE_IDENTIFIER: $(MC_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(MC_ENTITLEMENTS)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
